# Two stages, by design (same split as Tablassert):
#
# pre-commit -- fast, auto-fixing checks only. Committing must stay cheap.
# pre-push   -- whole-repo gates that most often break CI (golangci-lint, compile with
#               warnings-as-errors, credo, the offline test suites, the kgs/ validator).
#               They run once per push, so a red build is caught before it reaches a PR
#               without taxing the edit/commit loop.
#
# Every `local` hook calls a Makefile target, so hooks, CI and `make check` cannot drift.
default_install_hook_types: [pre-commit, pre-push]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^(cli/testdata/|web/test/fixtures/|docs/cli/)
      - id: end-of-file-fixer
        exclude: ^(cli/testdata/|web/test/fixtures/|docs/cli/)
      - id: check-yaml
      - id: check-json
        # tsconfig.json is JSONC (comments allowed) and is generated by phx.new.
        exclude: ^web/assets/tsconfig\.json$
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=512]
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      # Secrets live in ~/.envrc and the gitignored .envrc; this is the backstop.
      - id: gitleaks
  - repo: local
    hooks:
      - id: gofumpt
        name: gofumpt
        entry: gofumpt -w
        language: system
        types: [go]
      - id: mix-format
        name: mix format
        entry: make ex-fmt
        language: system
        files: ^(web|docs)/.*\.(ex|exs|heex)$|^kgs/.*\.exs$
        pass_filenames: false
      - id: go-lint
        name: golangci-lint
        entry: make go-lint
        language: system
        types: [go]
        pass_filenames: false
        stages: [pre-push]
      - id: go-test
        name: go test -race
        entry: make go-test
        language: system
        files: ^cli/
        pass_filenames: false
        stages: [pre-push]
      - id: ex-compile
        name: mix compile --warnings-as-errors
        entry: make ex-compile
        language: system
        files: ^(web|kgs)/
        pass_filenames: false
        stages: [pre-push]
      - id: credo
        name: credo --strict
        entry: make ex-lint
        language: system
        files: ^web/
        pass_filenames: false
        stages: [pre-push]
      - id: ex-test
        name: mix test
        entry: make ex-test
        language: system
        files: ^(web|kgs|cli/testdata)/
        pass_filenames: false
        stages: [pre-push]
      - id: kgs-check
        name: mix linkouts.check
        entry: make kgs-check
        language: system
        files: ^(kgs|web/lib/edge_linkouts/display)/
        pass_filenames: false
        stages: [pre-push]
