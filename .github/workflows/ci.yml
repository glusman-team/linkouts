name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Every step is a Makefile target, so CI and `make check` cannot drift.
# Jobs are independent (no `needs`) and run in parallel.
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum
      - name: gofumpt
        run: go install mvdan.cc/gofumpt@v0.12.0 && make go-fmt-check
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
          working-directory: cli
      - name: Test (race, offline)
        run: make go-test
      - name: Fuzz smoke
        run: cd cli && go test -run='^$' -fuzz=FuzzDelta -fuzztime=10s ./internal/codec/
      # Informational: the remaining findings are Go stdlib advisories fixed in the
      # unreleased go1.26.9. Flip to blocking after that toolchain bump.
      - name: govulncheck (informational)
        continue-on-error: true
        run: make go-vulncheck

  elixir:
    runs-on: ubuntu-latest
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        id: beam
        with:
          otp-version: "28"
          elixir-version: "1.19"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            web/deps
            web/_build
          key: mix-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('web/mix.lock') }}
          restore-keys: mix-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-
      - run: cd web && mix deps.get
      - run: make ex-fmt-check
      - run: make ex-compile
      - run: make ex-lint
      - run: make ex-test

      - run: make ex-test-cluster
      - run: make kgs-check
      - run: make ex-audit

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: "28"
          elixir-version: "1.19"
      - run: cd docs && mix deps.get && cd ../web && mix deps.get
      - run: make docs-check
      # Here rather than in its own job: it needs both Go (to regenerate the fixtures) and Elixir
      # (to read them), and this job already sets up both.
      - run: make contract-check

  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: j178/prek-action@1382ad72dea72f9d53832f2bcb65b3e87a947204 # v3.0.1
        with:
          extra-args: --all-files --hook-stage pre-commit --skip gofumpt --skip mix-format
