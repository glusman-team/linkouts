name: Docs

on:
  push:
    branches: [main]
    paths: [docs/**, kgs/**, web/lib/edge_linkouts/display/**, cli/cmd/**]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum
      - uses: erlef/setup-beam@v1.24.1
        with:
          otp-version: "28"
          elixir-version: "1.19"
      - run: cd docs && mix deps.get && cd ../web && mix deps.get
      - run: make docs
      - uses: actions/configure-pages@v6.0.0
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: docs/doc

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5.0.1
